name: release-desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-14
            bundle: dmg
            target: aarch64-apple-darwin
          - name: windows-x64
            runner: windows-2022
            bundle: nsis
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target

      - name: prepare-macos-path
        if: matrix.runner == 'macos-14'
        run: echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: install-dependencies
        run: pnpm install --frozen-lockfile

      - name: setup-native-deps
        run: node scripts/setup.js
        env:
          APPLE_SIGNING_IDENTITY: "-"
          RUST_TARGET_TRIPLE: ${{ matrix.target }}

      - name: prepare-desktop-config
        run: pnpm run preparescript
        working-directory: apps/desktop

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SERVER_URL: https://orbit.diveshbalani.com
          APPLE_SIGNING_IDENTITY: "-"
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_name }}
          releaseName: Orbit ${{ github.ref_name }}
          releaseBody: Desktop release for Orbit.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --config src-tauri/tauri.prod.conf.json --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
